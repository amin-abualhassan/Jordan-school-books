name: Discover NCCD textbooks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Check connectivity
        run: |
          curl -sS -o /dev/null -w "nccd.gov.jo -> %{http_code}\n" --max-time 60 https://www.nccd.gov.jo/ || true
      - name: Crawl grade pages
        run: python scripts/discover.py crawl
      - name: Render probe
        run: python scripts/render_probe.py crawl https://www.nccd.gov.jo/ar/pages/TextBooksGrade/68 https://www.nccd.gov.jo/ar/pages/TextBooksGrade/77
        continue-on-error: true
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawl
          git commit -m "Snapshot NCCD textbook pages [skip ci]" || echo "nothing to commit"
          git push
